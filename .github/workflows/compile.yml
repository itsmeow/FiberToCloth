name: Compile

on:
  [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }
      - {
          name: "Set up JDK 21",
          uses: actions/setup-java@v4,
          with: { distribution: "adopt", java-version: "21" },
        }
      - name: Compile
        run: ./gradlew build